<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mockup Fotorrealista - Mente Desligada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0B1026;
      --bg-darker: #0F1530;
      --text-gold: #ebd494;
      --text-cream: #fdf2d5;
      --text-muted: rgba(235, 212, 148, 0.7);
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: 'Manrope', sans-serif;
    }
    .scene {
      width: 100vw;
      height: 100vh;
      perspective: 2000px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('/mockup-bg.png') center/cover no-repeat;
      position: relative;
    }
    /* Calibration overlay for dev */
    .controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 20px;
      z-index: 100;
      border-radius: 8px;
    }
    
    .book {
      position: relative;
      width: 380px;
      height: 560px;
      transform-style: preserve-3d;
      /* Initial Calibration (Will be adjusted if needed) */
      transform: translateY(40px) rotateX(45deg) rotateY(15deg) rotateZ(5deg);
      transition: transform 0.1s;
    }

    /* Soft Contact Shadow */
    .book::before {
      content: '';
      position: absolute;
      inset: -10px;
      background: rgba(10, 5, 0, 0.6);
      transform: translateZ(-3px) translateY(10px) translateX(15px);
      filter: blur(25px);
      border-radius: 10px;
    }

    /* Sharp Contact Shadow */
    .book-shadow-core {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      transform: translateZ(-1px) translateY(3px) translateX(4px);
      filter: blur(5px);
      border-radius: 4px;
    }

    .cover {
      position: absolute;
      inset: 0;
      background: linear-gradient(150deg, var(--bg-dark), var(--bg-darker));
      border-radius: 2px 6px 6px 2px;
      box-shadow: inset 4px 0 10px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 30px 30px 30px;
      text-align: center;
      overflow: hidden;
    }

    /* Stars */
    .stars {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(1px 1px at 20% 30%, white, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 80% 20%, white, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 40% 70%, white, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 70% 80%, white, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 15% 85%, white, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 85% 55%, white, rgba(255,255,255,0));
      opacity: 0.3;
      pointer-events: none;
    }

    /* Sheen overlay reflecting natural light */
    .cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.02) 40%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      border-radius: 2px 6px 6px 2px;
    }

    /* Pages Edge (Right Side) */
    .pages-right {
      position: absolute;
      top: 3px;
      bottom: 3px;
      right: -25px;
      width: 25px;
      background: linear-gradient(to right, #f4ecd8, #ffffff, #dcd0b3);
      transform-origin: left;
      transform: rotateY(90deg);
      border-top-right-radius: 3px;
      border-bottom-right-radius: 3px;
      /* Horizontal lines for pages */
      background-image: repeating-linear-gradient(to bottom, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    }

    /* Pages Edge (Top Side) */
    .pages-top {
      position: absolute;
      top: -25px;
      left: 3px;
      right: 3px;
      height: 25px;
      background: linear-gradient(to bottom, #dcd0b3, #f4ecd8);
      transform-origin: bottom;
      transform: rotateX(90deg);
      background-image: repeating-linear-gradient(to right, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    }

    /* Spine (Left Side) */
    .spine {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -25px;
      width: 25px;
      background: linear-gradient(150deg, #060914, #080b1f);
      transform-origin: right;
      transform: rotateY(-90deg);
      box-shadow: inset -5px 0 10px rgba(0,0,0,0.5);
    }

    /* Typography & Content Layout */
    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 40px;
      z-index: 10;
    }
    .brand-icon {
      font-size: 10px;
      color: var(--text-gold);
    }
    .brand-name {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--text-gold);
      text-transform: uppercase;
    }

    .main-moon {
      font-size: 80px;
      line-height: 1;
      margin-bottom: 50px;
      color: var(--text-cream);
      text-shadow: 0 0 20px rgba(253, 242, 213, 0.4);
      z-index: 10;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.35em;
      color: var(--text-gold);
      margin-bottom: 12px;
      text-transform: uppercase;
      z-index: 10;
    }

    .title {
      font-size: 64px;
      line-height: 1.1;
      color: var(--text-cream);
      margin: 0 0 20px 0;
      z-index: 10;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 12px;
    }
    .title-number {
      font-family: 'Manrope', sans-serif;
      font-weight: 400;
    }
    .title-word {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 600;
    }

    .subtitle {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-cream);
      font-family: 'Playfair Display', serif;
      font-style: italic;
      max-width: 260px;
      margin: 0 auto auto auto; /* Pushes footer down */
      z-index: 10;
    }

    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      z-index: 10;
      margin-top: auto;
    }

    .progress-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      border: 1px solid var(--text-gold);
    }
    .dot.filled {
      background-color: var(--text-gold);
      box-shadow: 0 0 6px rgba(235, 212, 148, 0.6);
    }

    .footer-eyebrow {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--text-gold);
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .credibility {
      font-size: 7px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      text-transform: uppercase;
      opacity: 0.7;
    }

  </style>
</head>
<body>

  <div class="controls" style="display: none;">
    <label>rotateX: <input type="range" id="rx" min="-90" max="90" value="45"></label><br>
    <label>rotateY: <input type="range" id="ry" min="-90" max="90" value="15"></label><br>
    <label>rotateZ: <input type="range" id="rz" min="-90" max="90" value="5"></label>
  </div>

  <div class="scene">
    <div class="book" id="book">
      <div class="book-shadow-core"></div>
      
      <!-- Edges and Spine -->
      <div class="pages-right"></div>
      <div class="pages-top"></div>
      <div class="spine"></div>

      <!-- Cover -->
      <div class="cover">
        <div class="stars"></div>
        
        <div class="brand-lockup">
          <span class="brand-icon">🌙</span>
          <span class="brand-name">Mente Desligada™</span>
        </div>

        <div class="main-moon">🌙</div>

        <div class="eyebrow">O Protocolo de</div>
        
        <h1 class="title">
          <span class="title-number">7</span>
          <span class="title-word">Noites</span>
        </h1>

        <p class="subtitle">Pegue no sono em até 20 minutos — mesmo com a cabeça a mil, sem remédios.</p>

        <div class="footer">
          <div class="progress-bar">
            <div class="dot filled"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
          <div class="footer-eyebrow">Um ajuste por noite · 10 minutos por dia</div>
          
          <div class="credibility">Baseado em técnicas de TCC-I — Terapia Cognitivo-Comportamental para Insônia</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Simple interactive calibration tool if we open it in browser
    const book = document.getElementById('book');
    const rx = document.getElementById('rx');
    const ry = document.getElementById('ry');
    const rz = document.getElementById('rz');

    function updateTransform() {
      book.style.transform = `translateY(40px) rotateX(${rx.value}deg) rotateY(${ry.value}deg) rotateZ(${rz.value}deg)`;
    }

    rx.addEventListener('input', updateTransform);
    ry.addEventListener('input', updateTransform);
    rz.addEventListener('input', updateTransform);
  </script>
</body>
</html>
